[package]
name = "amqproxy"
version = "0.1.0"
edition = "2024"
description = "AMQP 0-9-1 connection-pooling proxy, a Rust port of cloudamqp/amqproxy v0.4.4"
license = "MIT"
repository = "https://github.com/zhi-guan/rs-amqproxy"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false }
socket2 = { version = "0.6.5", features = ["all"] }
tikv-jemallocator = { version = "0.7.0", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-util", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
webpki-roots = "1.0.10"

[features]
# jemalloc 需要本机有 make（musl 构建还需要 musl-tools）。见 ADR-0004。
jemalloc = ["dep:tikv-jemallocator"]

[profile.release]
lto = true
codegen-units = 1
strip = true
