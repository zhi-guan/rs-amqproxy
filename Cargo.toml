[package]
name = "amqproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
socket2 = { version = "0.6.5", features = ["all"] }
tikv-jemallocator = { version = "0.7.0", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
webpki-roots = "1.0.10"

[features]
# jemalloc 需要本机有 make（musl 构建还需要 musl-tools）。见 ADR-0004。
jemalloc = ["dep:tikv-jemallocator"]
