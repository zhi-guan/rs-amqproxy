[package]
name = "amqproxy"
version = "0.1.0"
edition = "2024"
description = "AMQP 0-9-1 connection-pooling proxy, a Rust port of cloudamqp/amqproxy v0.4.4"
license = "MIT"
repository = "https://github.com/zhi-guan/rs-amqproxy"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false }
socket2 = { version = "0.6.5", features = ["all"] }
tikv-jemallocator = { version = "0.7.0", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-util", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
webpki-roots = "1.0.10"

[features]
default = ["jemalloc"]
# 默认启用 jemalloc（ADR-0004）。构建它需要 make；没有 make 的机器用 --no-default-features。
jemalloc = ["dep:tikv-jemallocator"]
# 需要本机运行 test/docker-compose.yml 里的 RabbitMQ 的集成测试。
integration = []

[profile.release]
lto = true
codegen-units = 1
strip = true
